events { }

http {
    include       /etc/nginx/mime.types;
    server_tokens off;

    server {
            listen  80;
            server_name algotrading;

            # Airflow 3 cannot be served under a sub-path without changing its base_url (and
            # the execution API URL the workers use), so send people to its own port.
            location  /airflow {
                        return 302 http://$host:8080/;
            }

            location /trading {
                        # Public, unauthenticated. To protect it, create the file with
                        # `htpasswd -c` (apache2-utils), COPY it in the Dockerfile and uncomment:
                        # auth_basic           "Cerebro";
                        # auth_basic_user_file /etc/nginx/.htpasswd;
                        alias /etc/nginx/html/CEREBRO/OUTPUT/;
                        index RECOMENDATIONS.html;
            }

            location /health {
                    access_log off;
                    return 200 "healthy\n";
            }

            # Anything else (and any dotfile, even under /trading) is not served.
            location ~ /\. {
                        deny all;
            }
            location / {
                        return 404;
            }
        }
    }
